name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main
      - dev-features
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Tests
        run: cargo test --manifest-path app/Cargo.toml

  build-release:
    name: Build Android APK & Release
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        id: setup-android
        with:
          api-level: 34
          build-tools-version: 34.0.0
          ndk-version: 25.2.9519653
          include-ndk: true

      - name: Configure Android NDK Home
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-android.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME is ${{ steps.setup-android.outputs.ndk-path }}"

      - name: Add Rust Targets Explicitly
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Build Release APK
        run: cargo apk build --release --manifest-path app/Cargo.toml

      - name: Upload Release Asset & Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/target/release/apk/healthifyme_mobile.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
